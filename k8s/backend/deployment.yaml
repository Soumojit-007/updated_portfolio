apiVersion: apps/v1
kind: Deployment

metadata:
  name: portfolio-backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: portfolio-backend

  template:
    metadata:
      labels:
        app: portfolio-backend

    spec:
      containers:
        - name: backend
          image: portfolio-backend:latest

          ports:
            - containerPort: 5000

          env:
            - name: PORT
              value: "5000"

            - name: EMAIL_USER
              valueFrom:
                secretKeyRef:
                  name: portfolio-backend-secret
                  key: EMAIL_USER

            - name: EMAIL_PASS
              valueFrom:
                secretKeyRef:
                  name: portfolio-backend-secret
                  key: EMAIL_PASS

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          imagePullPolicy: IfNotPresent
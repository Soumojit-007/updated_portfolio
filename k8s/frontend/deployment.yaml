apiVersion: apps/v1
kind: Deployment

metadata:
  name: portfolio-frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: portfolio-frontend

  template:
    metadata:
      labels:
        app: portfolio-frontend

    spec:
      containers:
        - name: frontend
          image: portfolio-frontend:latest

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          imagePullPolicy: IfNotPresent